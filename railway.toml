# Ignore everything by default when Railway scans from repo root.
# Prefer setting Root Directory = backend in the Railway service settings.
# This file exists so a root-level Railway project can still point at backend/.

[build]
builder = "NIXPACKS"
buildCommand = "cd backend && pip install -r requirements.txt"

[deploy]
startCommand = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5